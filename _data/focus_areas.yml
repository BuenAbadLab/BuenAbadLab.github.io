- title: "RNA splicing & unproductive transcripts"
  description: >
    An often overlooked aspect of alternative splicing is the generation of defective transcripts that 
    are degraded through nonsense mediated decay (NMD). This "unproductive splicing" shapes gene expression
    and links genetic variation to complex traits and disease.

- title: "Single-cell & multi-omics"
  description: >
    We develop statistical methods to detect cell-state-associated splicing
    and coregulation from single-cell data, and to integrate transcriptomic,
    genomic, and epigenomic data across scales.

- title: "Statistical genomics & method development"
  description: >
    We build reference-free, interpretable computational models to uncover novel
    transcript structures in large-scale RNA-seq and multi-omics datasets.
